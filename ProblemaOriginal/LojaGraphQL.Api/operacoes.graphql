# Operações da Aula 7 — cole no Nitro (http://localhost:5231/graphql)
# e informe as variáveis indicadas acima de cada operação.

# Variáveis:
# {
#   "input": {
#     "nome": "Webcam 4K",
#     "categoria": "Vídeo",
#     "preco": 799.90,
#     "estoque": 4
#   }
# }
mutation CriarProduto($input: CriarProdutoInput!) {
  criarProduto(input: $input) {
    produto {
      id
      nome
      categoria
      preco
      estoque
    }
  }
}

# Esperado: erro com o código PRODUTO_PRECO_INVALIDO.
# Variáveis:
# {
#   "input": {
#     "nome": "Produto inválido da aula",
#     "categoria": "Teste",
#     "preco": 0,
#     "estoque": 1
#   }
# }
mutation RejeitarPrecoInvalido($input: CriarProdutoInput!) {
  criarProduto(input: $input) {
    produto {
      id
    }
  }
}

# Esperado: erro com o código PRODUTO_NOME_INVALIDO.
# Variáveis:
# {
#   "input": {
#     "nome": "   ",
#     "categoria": "Teste",
#     "preco": 10,
#     "estoque": 1
#   }
# }
mutation RejeitarNomeInvalido($input: CriarProdutoInput!) {
  criarProduto(input: $input) {
    produto {
      id
    }
  }
}

# Executar depois de CriarProduto, usando o id retornado.
# Variáveis:
# {
#   "id": 4
# }
query ConfirmarProduto($id: Int!) {
  produtoPorId(id: $id) {
    id
    nome
    categoria
    preco
    estoque
  }
}
